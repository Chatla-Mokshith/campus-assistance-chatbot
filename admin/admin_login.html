<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Horizon Institute</title>
  <meta name="description" content="Secure administrator login for Horizon Institute Campus Portal." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --surface: rgba(15, 23, 42, 0.75);
      --border: rgba(148, 163, 184, 0.18);
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #060b18;
      overflow: hidden;
    }

    /* Animated gradient orbs */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: float 12s ease-in-out infinite;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.4), transparent 70%);
      top: -150px;
      left: -100px;
      animation-duration: 14s;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.25), transparent 70%);
      bottom: -100px;
      right: -80px;
      animation-duration: 10s;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.2), transparent 70%);
      top: 50%;
      left: 60%;
      animation-duration: 16s;
      animation-delay: -7s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      33% {
        transform: translate(30px, -25px) scale(1.05);
      }

      66% {
        transform: translate(-20px, 15px) scale(0.95);
      }
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 2rem 1rem;
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2.25rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--border);
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo-badge {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      box-shadow: 0 8px 24px var(--primary-glow);
      font-size: 1.75rem;
    }

    h1 {
      text-align: center;
      color: var(--text);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.375rem;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    .alert {
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.45rem;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 0.875rem;
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 0.875rem 0.75rem 2.6rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.08);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    input::placeholder {
      color: #475569;
    }

    .toggle-pw {
      position: absolute;
      right: 0.875rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1rem;
      padding: 0;
      line-height: 1;
      transition: color 0.2s;
    }

    .toggle-pw:hover {
      color: var(--text);
    }

    .btn-login {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 18px var(--primary-glow);
      margin-top: 0.5rem;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px var(--primary-glow);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .hint-box {
      margin-top: 1.5rem;
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 10px;
      padding: 0.875rem 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }

    .hint-box strong {
      color: #a5b4fc;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--text);
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="login-wrapper">
    <div class="card">
      <div class="logo-badge">🎓</div>
      <h1>Admin Portal</h1>
      <p class="subtitle">Horizon Institute of Technology — Secure Access</p>

      {% if error %}
      <div class="alert alert-error" role="alert">
        <span>⚠️</span> {{ error }}
      </div>
      {% endif %}

      <form id="loginForm" method="POST" action="/admin/login" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input id="username" type="text" name="username" placeholder="Enter admin username" autocomplete="username"
              required autofocus />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔐</span>
            <input id="password" type="password" name="password" placeholder="Enter admin password"
              autocomplete="current-password" required />
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="submitBtn">
          <span id="btnText">Sign In to Dashboard</span>
          <div class="spinner" id="spinner"></div>
        </button>
      </form>

      <div class="hint-box">
        <strong>Default credentials (development only):</strong><br />
        Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>Admin@Horizon2026!</strong>
      </div>

      <a href="/" class="back-link">← Return to Student Portal</a>
    </div>
  </div>

  <script>
    const pwInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePw');
    toggleBtn.addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      toggleBtn.textContent = isHidden ? '🙈' : '👁';
    });

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    form.addEventListener('submit', () => {
      if (!form.checkValidity()) return;
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      spinner.style.display = 'block';
    });
  </script>
</body>

</html>
